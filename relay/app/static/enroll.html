<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
  <title>Enroll phone</title>
</head>
<body>
  <main>
    <h1>Enroll phone</h1>

  </main>
  <script src="/app.js"></script>
</body>
</html>
