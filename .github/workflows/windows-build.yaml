name: Windows build

on:
  workflow_call:
    inputs:
      release-artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    env:
      BUILD_CONFIG: ${{ inputs.release-artifacts && 'Release' || 'RelWithDebInfo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S windows -B windows/build -A x64 -DQUICKUNLOCKER_COVERAGE=${{ !inputs.release-artifacts }}
      - name: Build
        run: cmake --build windows/build --config $env:BUILD_CONFIG
      - name: Test
        run: ctest --test-dir windows/build -C $env:BUILD_CONFIG --output-on-failure
      - name: Collect native CTest coverage
        if: '!inputs.release-artifacts'
        shell: pwsh
        run: ./windows/collect-coverage.ps1 -Configuration $env:BUILD_CONFIG
      - uses: hotdog-werx/mustard@171f9e94181923330a53cad9691fa931ac06e08c # badge and reusable-workflow fixes
        if: '!inputs.release-artifacts'
        with:
          mode: upload
          name: cpp
          config: .github/mustard-windows.yml
          files: coverage-cpp.xml
          format: cobertura
          shard: windows-x64
      - name: Windows signing placeholder
        if: inputs.release-artifacts
        # Future integration point for Azure Trusted Signing, before checksums.
        run: Write-Output 'Building unsigned Windows artifacts'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.release-artifacts
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            windows/build/Release/quickunlocker.dll
            windows/build/Release/quickunlocker-setup.exe
