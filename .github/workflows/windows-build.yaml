name: Windows build

on:
  workflow_call:
    inputs:
      release-artifacts:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-2025
    env:
      BUILD_CONFIG: ${{ inputs.release-artifacts && 'Release' || 'RelWithDebInfo' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure
        run: cmake -S windows -B windows/build -A x64
      - name: Build
        run: cmake --build windows/build --config $env:BUILD_CONFIG
      - name: Test
        run: ctest --test-dir windows/build -C $env:BUILD_CONFIG --output-on-failure
      - name: Download LLVM for coverage
        if: '!inputs.release-artifacts'
        id: coverage-llvm
        shell: pwsh
        run: |
          $version = '22.1.8'
          $asset = "LLVM-$version-win64.exe"
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $root = Join-Path $env:RUNNER_TEMP "llvm-$version"
          curl.exe --fail --location --retry 3 --silent --show-error `
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$version/$asset" --output $archive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne '16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c') {
            throw 'LLVM download did not match the pinned SHA-256.'
          }
          & "$env:ProgramFiles/7-Zip/7z.exe" x $archive "-o$root" bin lib -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "root=$root" >> $env:GITHUB_OUTPUT
      - name: Collect Windows CTest coverage with Clang
        if: '!inputs.release-artifacts'
        shell: pwsh
        env:
          COVERAGE_LLVM_ROOT: ${{ steps.coverage-llvm.outputs.root }}
        run: ./windows/collect-coverage.ps1 -LlvmRoot $env:COVERAGE_LLVM_ROOT
      - uses: hotdog-werx/mustard@171f9e94181923330a53cad9691fa931ac06e08c # badge and reusable-workflow fixes
        if: '!inputs.release-artifacts'
        with:
          mode: upload
          name: cpp
          config: .github/mustard-windows.yml
          files: windows/build/coverage/coverage-cpp.lcov
          format: lcov
          shard: windows-x64
      - name: Windows signing placeholder
        if: inputs.release-artifacts
        # Future integration point for Azure Trusted Signing, before checksums.
        run: Write-Output 'Building unsigned Windows artifacts'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: inputs.release-artifacts
        with:
          name: windows-x64
          if-no-files-found: error
          path: |
            windows/build/Release/quickunlocker.dll
            windows/build/Release/quickunlocker-setup.exe
