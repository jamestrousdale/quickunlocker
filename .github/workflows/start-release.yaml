name: Start release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Release version bump
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry-run:
        description: Preview without creating a release PR
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.24'
          enable-cache: true
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - uses: hotdog-werx/releez@7c76cfb8f6c6f023cc297927a35f444392811afb # 1.1.2
        with:
          mode: start
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
