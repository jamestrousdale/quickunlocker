[settings]
experimental = true
python.uv_venv_auto = true

[env]
GIT_CLIFF_CONFIG = "./cliff.toml"
_.uv-toolbox = { tools = true }
_.file = [".repolish/*/mise-tasks/defaults.env"]
DK_UVTB_TOOLS_EXEC = ""
DK_RUFF_CONFIG = "pyproject.toml"
DK_PROJECT_SOURCE = "relay/app"
DK_PYTEST_COV_TARGET = "relay/app"

[[hooks.postinstall]]
run = "uv-toolbox install"

[[hooks.postinstall]]
run = "uv-toolbox exec --env repolish -- repolish link"

[tools]
python = "3.13"
uv = "0.12.24"
dprint = "0.55.1"
git-cliff = "2.12.0"
actionlint = "1.7.10"
shellcheck = "0.11.0"
"pipx:uv-toolbox" = "0.4.1"
"pipx:ruff" = "0.14.14"
"pipx:ty" = "0.0.59"
"pipx:complexipy" = "4.0.2"
"pipx:pydoclint" = "0.9.1"
"pipx:releez" = "1.1.2"
"pipx:zensical" = "0.0.62"

[task_config]
includes = [
  "mise-tasks",
  ".repolish/hotdogwerx-devkit-workspace/mise-tasks",
  ".repolish/hotdogwerx-devkit-python/mise-tasks",
]

[tasks.format]
depends = ["python:format", "workspace:dprint:format"]

[tasks.ci-checks]
depends = [
  "python:check:ruff",
  "python:check:ty",
  "python:check:complexity",
  "python:check:pydoclint",
  "python:check:coverage",
  "workspace:dprint:check",
  "workspace:actionlint:check",
  "workspace:repolish:check",
  "workspace:uv-toolbox-lock:check",
  "workspace:docs:build",
]

[plugins]
uv-toolbox = "https://github.com/hotdog-werx/uv-toolbox"
